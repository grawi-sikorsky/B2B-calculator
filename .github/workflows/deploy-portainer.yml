name: Build and Deploy - GH hosted + webhook deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    # Repo przeniesione do jsikora-org (2026-08-24) - korzystamy z runnera
    # przypisanego do organizacji zamiast ubuntu-latest.
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build and push Docker image
      run: |
        docker build -t chodzi/b2bcalculator:latest .
        docker push chodzi/b2bcalculator:latest

    - name: Portainer Webhook call
      run: curl -X POST ${{ secrets.PORTAINER_WEBHOOK_URL }}

    - name: Update Portainer Stack
      run: |
        curl -X POST "${{ secrets.PORTAINER_URL }}/api/stacks/9/deploy" \
          -H "X-API-Key: ${{ secrets.PORTAINER_API_TOKEN }}"

