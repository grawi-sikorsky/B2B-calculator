name: Deploy (k3s)

# Pojedyncze środowisko (bez staging jak w conficast/dev-whisper) — B2B-calculator to
# statyczna kalkulatorowa strona bez bazy/płatności, więc każdy push na develop jedzie
# prosto na klaster. Wzorowane na portfolio (.github/workflows/deploy.yml).
on:
  workflow_dispatch: {}
  push:
    branches:
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/b2b-calculator

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:develop,${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=local,src=/home/chodzi/buildx-cache/b2b-calculator
          cache-to: type=local,dest=/home/chodzi/buildx-cache/b2b-calculator,mode=max

  deploy:
    needs: build
    runs-on: self-hosted
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Runner ma już skonfigurowany ~/.kube/config (dostęp do klastra), tak jak przy
      # dev-whisper/conficast/portfolio — brak KUBECONFIG w env poniżej celowo, kubectl
      # bierze domyślną lokalizację.
      - name: Deploy to k3s
        env:
          IMAGE_SHA: sha-${{ github.sha }}
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd deployment/k8s

          kubectl apply -f namespace.yaml
          ./create-secrets.sh

          for f in deployment.yaml service.yaml; do
            envsubst < "$f" | kubectl apply -f -
          done

          kubectl -n b2b-calculator rollout status deployment/b2b-calculator-web --timeout=3m
